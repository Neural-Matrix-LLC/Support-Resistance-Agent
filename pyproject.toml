[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sr-agent"
description = "Support & Resistance agent: deterministic level engine + calibrated probabilities; the LLM only plans and narrates."
dynamic = ["version"]
# The library targets 3.11+; the pinned development interpreter is in
# .python-version, and [tool.mypy] python_version must match it.
requires-python = ">=3.11"
dependencies = [
    "exchange_calendars>=4.5",
    "numpy>=1.26",
    "polars>=1.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6",
    "typer>=0.12",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "mypy", "ruff", "types-PyYAML"]

[project.scripts]
sr = "sr_agent.cli:main"

[tool.hatch.version]
path = "src/sr_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sr_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: hits real external services (Stooq); opt in with -m integration"]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.mypy]
files = ["src/sr_agent"]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
